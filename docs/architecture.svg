<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">How the powerbi plugin connects Claude Code to Power BI</title>
  <desc id="d">Claude Code uses four skills and the Power BI Modeling MCP server from the plugin. The server reads and changes a model open in Power BI Desktop, PBIP and TMDL files on disk, or a Fabric workspace. The screenshot skill captures the Desktop window and the setup skill installs and checks the plugin.</desc>
  <style>
    :root { --bg:#F7F8FA; --ink:#1A1F2B; --muted:#5A6272; --accent:#4F5BD5; --data:#E8A317; --ok:#2E9E6B; --card:#FFFFFF; --line:#C9CEDA; --accent-soft:#E9EBFB; --data-soft:#FCF2DA; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#12151C; --ink:#E8EAF0; --muted:#A5ACBC; --accent:#8B93F0; --data:#F2B84B; --ok:#4CC38A; --card:#1B2030; --line:#3A4157; --accent-soft:#232A4A; --data-soft:#3A3020; }
    }
    text { font-family: Inter, "Segoe UI", system-ui, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .plugin { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; }
    .skill { fill: var(--card); stroke: var(--accent); stroke-width: 1.5; }
    .mcp { fill: var(--data-soft); stroke: var(--data); stroke-width: 2; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 12.5px; fill: var(--muted); }
    .lbl { font-size: 12px; font-weight: 600; fill: var(--accent); }
    .flow { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 8 7; animation: dash 1.4s linear infinite; }
    .flow-d { stroke: var(--data); }
    @keyframes dash { to { stroke-dashoffset: -30; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <rect class="bg" width="960" height="440" rx="16"/>

  <rect class="card" x="30" y="150" width="170" height="130" rx="12"/>
  <text class="h" x="115" y="205" text-anchor="middle">Claude Code</text>
  <text class="s" x="115" y="228" text-anchor="middle">your request in</text>
  <text class="s" x="115" y="246" text-anchor="middle">plain language</text>

  <rect class="plugin" x="260" y="24" width="360" height="396" rx="16"/>
  <text class="lbl" x="280" y="50">powerbi plugin</text>

  <rect class="skill" x="285" y="64" width="310" height="56" rx="10"/>
  <text class="h" x="300" y="88">powerbi-mcp</text>
  <text class="s" x="300" y="108">chooses the tool, models, DAX, visuals</text>

  <rect class="skill" x="285" y="130" width="310" height="56" rx="10"/>
  <text class="h" x="300" y="154">power-bi-dax-optimization</text>
  <text class="s" x="300" y="174">faster, more readable DAX</text>

  <rect class="skill" x="285" y="196" width="310" height="56" rx="10"/>
  <text class="h" x="300" y="220">power-bi-screenshot</text>
  <text class="s" x="300" y="240">checks the result on screen</text>

  <rect class="skill" x="285" y="262" width="310" height="56" rx="10"/>
  <text class="h" x="300" y="286">powerbi-setup</text>
  <text class="s" x="300" y="306">guided install and check</text>

  <rect class="mcp" x="285" y="344" width="310" height="62" rx="10"/>
  <text class="h" x="300" y="369">powerbi-modeling-mcp</text>
  <text class="s" x="300" y="389">Microsoft server, started with npx</text>

  <rect class="card" x="700" y="48" width="230" height="96" rx="12"/>
  <text class="h" x="715" y="80">Power BI Desktop</text>
  <text class="s" x="715" y="102">model open on your machine</text>
  <text class="s" x="715" y="120">(live changes and queries)</text>

  <rect class="card" x="700" y="172" width="230" height="96" rx="12"/>
  <text class="h" x="715" y="204">PBIP and TMDL files</text>
  <text class="s" x="715" y="226">project folders on disk</text>
  <text class="s" x="715" y="244">(report JSON and model)</text>

  <rect class="card" x="700" y="296" width="230" height="96" rx="12"/>
  <text class="h" x="715" y="328">Fabric workspace</text>
  <text class="s" x="715" y="350">semantic models in the service</text>
  <text class="s" x="715" y="368">(deploy and refresh)</text>

  <path class="flow" d="M200 215 H260"/>
  <path class="flow flow-d" d="M595 375 C650 375 650 96 700 96"/>
  <path class="flow flow-d" d="M595 375 C650 375 650 220 700 220"/>
  <path class="flow flow-d" d="M595 375 C650 375 650 344 700 344"/>
  <path class="flow" d="M595 224 C660 224 660 130 700 118"/>
</svg>
